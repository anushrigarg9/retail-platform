
name: DevSecOps Security Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  checkov:
    name: Terraform Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Scan Terraform with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          soft_fail: true

  helm:
    name: Helm Chart Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint all microservice charts
        run: |
          helm lint src/ui/ui/chart
          helm lint src/catalog/catalog/chart
          helm lint src/cart/cart/chart
          helm lint src/checkout/checkout/chart
          helm lint src/orders/orders/chart


  trivy:
    name: Build and Scan Container Images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: ui
            context: src/ui
          - service: catalog
            context: src/catalog
          - service: cart
            context: src/cart
          - service: checkout
            context: src/checkout
          - service: orders
            context: src/orders

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build ${{ matrix.service }} image
        run: docker build -t ${{ matrix.service }}:ci ${{ matrix.context }}

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.73.0

      - name: Scan ${{ matrix.service }} image
        run: |
          trivy image \
            --timeout 15m \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format table \
            --output trivy-${{ matrix.service }}.txt \
            ${{ matrix.service }}:ci

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: trivy-report-${{ matrix.service }}
          path: trivy-${{ matrix.service }}.txt
          if-no-files-found: ignore

  k8s-security:
    name: Kubernetes Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Render Helm charts
        run: |
          mkdir -p rendered

          helm template ui src/ui/ui/chart > rendered/ui.yaml
          helm template catalog src/catalog/catalog/chart > rendered/catalog.yaml
          helm template cart src/cart/cart/chart > rendered/cart.yaml
          helm template checkout src/checkout/checkout/chart > rendered/checkout.yaml
          helm template orders src/orders/orders/chart > rendered/orders.yaml

      - name: Scan Kubernetes manifests with Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: rendered
          framework: kubernetes
          soft_fail: true

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rendered-kubernetes-manifests
          path: rendered/
          if-no-files-found: ignore
